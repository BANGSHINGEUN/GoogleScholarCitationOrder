version: '3.8'

services:
  searcher:
    build: .
    image: google-scholar-searcher
    container_name: google_scholar_searcher
    volumes:
      - ./app:/app/app
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - GOOGLE_SCHOLAR_URL=https://scholar.google.com
      - SEARCH_DELAY=2
      - MAX_PAGE_COUNT=100
      - USER_AGENT_ROTATION=true
      - HEADLESS=true
      - BROWSER_TYPE=chrome
      - LOG_LEVEL=INFO
    command: --keyword "mixture of experts" --results 20 --year-from 2024 --year-to 2025 --max-pages 20 --output /app/output/mixture_of_experts_results.json
