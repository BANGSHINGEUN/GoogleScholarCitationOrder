services:
  searcher:
    build: .
    image: google-scholar-searcher
    container_name: google_scholar_searcher
    volumes:
      - ./app:/app/app
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - GOOGLE_SCHOLAR_URL=https://scholar.google.com
      - SEARCH_DELAY=2
      - MAX_PAGE_COUNT=100
      - USER_AGENT_ROTATION=true
      - HEADLESS=true
      - BROWSER_TYPE=chrome
      - LOG_LEVEL=INFO
    command: --keyword "Optimizer" --results 10 --max-pages 10 --output /app/output/Optimizer.json
